name: CI

on:
  push:
    branches: [main, "aidd/**"]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      # O build nao precisa de valores reais; o .env.example so declara as chaves.
      - run: cp .env.example .env
      - name: Quality Gates AIDD (mesmos do pre-commit)
        run: |
          status=0
          for gate in gates/G_*.py; do
            python "$gate" . || status=1
          done
          exit $status
